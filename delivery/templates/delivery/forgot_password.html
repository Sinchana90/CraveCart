{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - CraveCart</title>

    <link
        rel="stylesheet"
        href="{% static 'delivery/forgot_password.css' %}"
    >

</head>

<body>

    <div class="forgot-container">

        <div class="logo">
            Crave<span>Cart</span>
        </div>

        <h1>Forgot Password?</h1>

        <p class="description">
            Enter your registered email address to reset your password.
        </p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        {% if success %}
            <div class="success-message">
                {{ success }}
            </div>
        {% endif %}

        <form method="POST">

    {% csrf_token %}

    <input
        type="email"
        name="email"
        placeholder="Enter your registered email"
        required
    >

    <button type="submit">
        Continue
    </button>

</form>

        <a
            href="{% url 'open_signin' %}"
            class="back-link"
        >
            ← Back to Sign In
        </a>

    </div>

</body>

</html>
