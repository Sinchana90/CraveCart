{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'delivery/add_restaurant.css' %}">
<title>CraveCart - Add Restaurant</title>
</head>
<body>

<div class="page">

    <div class="logo">
        <span class="mark">
            <svg viewBox="0 0 24 24"><path d="M4 4v16M4 4c4 0 4 4 0 4M20 4v16M20 4c-3 0-4 2-4 6v10"/></svg>
        </span>
        <span class="crave">Crave</span><span class="cart">Cart</span>
    </div>
    <p class="subtitle">Add a new restaurant</p>

    <div class="form-card">

        <h2>
            <span class="form-icon">
                <svg viewBox="0 0 24 24"><path d="M4 4v16M4 4c4 0 4 4 0 4M20 4v16M20 4c-3 0-4 2-4 6v10"/></svg>
            </span>
            Restaurant details
        </h2>

        <form action="{% url 'add_restaurant' %}" method="post">
            {% csrf_token %}

            <label>Restaurant name</label>
            <input type="text" name="name" placeholder="Enter restaurant name" required>

            <label>Picture URL</label>
            <input type="text" name="picture" placeholder="Enter restaurant image URL" required>

            <label>Cuisine</label>
            <input type="text" name="cuisine" placeholder="Example: Pizza, Indian, Chinese" required>

            <label>Rating</label>
            <input type="number" name="rating" min="0" max="5" step="0.5" placeholder="0 - 5" required>

            <div class="field-row">
                <div>
                    <label>Opening time</label>
                    <input type="time" name="opening_time" required>
                </div>
                <div>
                    <label>Closing time</label>
                    <input type="time" name="closing_time" required>
                </div>
            </div>

            <button type="submit">Add restaurant</button>
        </form>

        <a href="{% url 'admin_home' %}" class="back-link">&larr; Back to admin dashboard</a>

    </div>

</div>
</body>
</html>
