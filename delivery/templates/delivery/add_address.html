{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="{% static 'delivery/customer_home.css' %}"
    >

    <title>Add Address - CraveCart</title>

</head>

<body>


    <!-- NAVBAR -->

    <div class="topnav">

        <a
            href="{% url 'customer_home' username %}"
            class="brand"
        >

            <span class="mark">

                <svg viewBox="0 0 24 24">

                    <path d="M4 4v16M4 4c4 0 4 4 0 4M20 4v16M20 4c-3 0-4 2-4 6v10"/>

                </svg>

            </span>

            <span class="crave">
                Crave
            </span>

            <span class="cart">
                Cart
            </span>

        </a>


        <nav class="links">

            <a href="{% url 'customer_home' username %}">
                Restaurants
            </a>

            <a href="{% url 'show_cart' username %}">
                Cart
            </a>

            <a href="{% url 'show_favorites' username %}">
                Favorites
            </a>

        </nav>


        <div class="profile">

            <span class="avatar">
                {{ username|slice:":1"|upper }}
            </span>

            <a
                href="{% url 'profile' username %}"
                class="profile-link"
            >
                Profile
            </a>

        </div>

    </div>


    <!-- PAGE -->

    <main class="account-page">

        <div class="account-container">


            <div class="account-heading">

                <h1>
                    Add New Address
                </h1>

                <p>
                    Save another delivery address
                </p>

            </div>


            <section class="account-section">

                <form method="POST">

                    {% csrf_token %}


                    <!-- ADDRESS TYPE -->

                    <div class="edit-field">

                        <label>
                            Address Type
                        </label>

                        <select
                            name="label"
                            required
                        >

                            <option value="">
                                Select address type
                            </option>

                            <option value="home">
                                Home
                            </option>

                            <option value="work">
                                Work
                            </option>

                            <option value="other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- ADDRESS -->

                    <div class="edit-field">

                        <label>
                            Address
                        </label>

                        <textarea
                            name="address"
                            rows="4"
                            placeholder="Enter your delivery address"
                            required
                        ></textarea>

                    </div>


                    <!-- BUTTONS -->

                    <div class="edit-profile-actions">

                        <a
                            href="{% url 'profile' username %}"
                            class="cancel-profile-btn"
                        >
                            Cancel
                        </a>


                        <button
                            type="submit"
                            class="save-profile-btn"
                        >
                            Save Address
                        </button>

                    </div>

                </form>

            </section>

        </div>

    </main>

</body>

</html>
