{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - CraveCart</title>

    <link
        rel="stylesheet"
        href="{% static 'delivery/reset_password.css' %}"
    >
</head>

<body>

    <div class="reset-container">

        <div class="logo">
            Crave<span>Cart</span>
        </div>

        <h1>
            Create New Password
        </h1>

        <p class="description">
            Enter your new password below to secure your CraveCart account.
        </p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}
        

        <form method="POST">

            {% csrf_token %}

            <input
                type="password"
                name="new_password"
                placeholder="Enter new password"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm new password"
                required
            >

            <button type="submit">
                Reset Password
            </button>

        </form>

        <a
            href="{% url 'open_signin' %}"
            class="back-link"
        >
            ← Back to Sign In
        </a>

    </div>

</body>

</html>
